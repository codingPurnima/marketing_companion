
name: Deploy Flutter Web to Cloudflare

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: marketing_companion_web
        run: flutter pub get

      - name: Build Flutter Web
        working-directory: marketing_companion_web
        run: flutter build web --release

      - name: Deploy to Cloudflare
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy marketing_companion_web/build/web --project-name=marketing-companion
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Show deployment information
        run: |
          echo "Deployment URL: ${{ steps.deploy.outputs.deployment-url }}"
          echo "Deployment alias: ${{ steps.deploy.outputs.pages-deployment-alias-url }}"
